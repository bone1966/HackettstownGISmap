<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Where to Live in Hackettstown, NJ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }

    .legend {
      background: #fff;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.4;
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
    }
    .legend i {
      width: 14px;
      height: 14px;
      float: left;
      margin-right: 6px;
      opacity: 0.9;
    }

    .leaflet-popup-content {
      font-size: 13px;
    }
    .popup-title {
      font-weight: 600;
      color: #f36f21; /* Hackettstown Tiger orange */
      margin-bottom: 4px;
    }
    .popup-legend {
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px solid #ddd;
      font-size: 11px;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // --- Base map ---
  const map = L.map('map').setView([40.853, -74.829], 13); // whole-town frame

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // --- Style helpers (Tiger theme) ---
  function neighborhoodStyle(feature) {
    return {
      color: '#000000',
      weight: 2,
      fillColor: feature.properties.fillColor || '#f36f21',
      fillOpacity: 0.35
    };
  }

  function valueStyle(feature) {
    const tier = feature.properties.tier;
    let fill = '#ffe5c7'; // entry-level default

    if (tier === 'mid') fill = '#f9a64a';
    if (tier === 'premium') fill = '#f36f21';

    return {
      color: '#000000',
      weight: 1,
      fillColor: fill,
      fillOpacity: 0.35
    };
  }

  const iconBlack = L.icon({
    iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34]
  });

  // --- GeoJSON placeholders ---
  // Replace these with your actual GeoJSON files or inline objects.

  const neighborhoodsGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": {

        "vibe": "Quiet residential, close to schools",
        "walkability": "Moderate",
        "transit": "6 min to Station",
        "parks": "Near Riverfront Park",
        "tierLabel": "Mid-range",
        "tierDesc": "$400–600K",
        "fillColor": "#f9a64a"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8365, 40.8538],
          [-74.8332, 40.8539],
          [-74.8298, 40.8514],
          [-74.8301, 40.8489],
          [-74.8359, 40.8492],
          [-74.8365, 40.8538]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "College View",
        "vibe": "Walkable, near Centenary University",
        "walkability": "High",
        "transit": "Quick access to 46",
        "parks": "Close to Stephens State Park",
        "tierLabel": "Mid-range",
        "tierDesc": "$400–600K",
        "fillColor": "#f9a64a"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8297, 40.8568],
          [-74.8268, 40.8570],
          [-74.8249, 40.8548],
          [-74.8254, 40.8529],
          [-74.8292, 40.8530],
          [-74.8297, 40.8568]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "Mountain View",
        "vibe": "Hillside homes, quiet streets",
        "walkability": "Low",
        "transit": "Close to Rt 517",
        "parks": "Near Stephens State Park",
        "tierLabel": "Premium",
        "tierDesc": "$600K+",
        "fillColor": "#f36f21"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8248, 40.8567],
          [-74.8210, 40.8572],
          [-74.8195, 40.8544],
          [-74.8208, 40.8524],
          [-74.8245, 40.8530],
          [-74.8248, 40.8567]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "Downtown",
        "vibe": "Walkable, shops & dining",
        "walkability": "High",
        "transit": "3 min to Station",
        "parks": "Riverfront Park nearby",
        "tierLabel": "Entry-level",
        "tierDesc": "<$400K",
        "fillColor": "#ffe5c7"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8320, 40.8530],
          [-74.8290, 40.8531],
          [-74.8285, 40.8510],
          [-74.8318, 40.8509],
          [-74.8320, 40.8530]
        ]]
      }
    }
  ]
};
  const valueZonesGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": { "tier": "entry" },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8330, 40.8528],
          [-74.8295, 40.8529],
          [-74.8290, 40.8508],
          [-74.8328, 40.8507],
          [-74.8330, 40.8528]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": { "tier": "mid" },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8360, 40.8540],
          [-74.8330, 40.8541],
          [-74.8298, 40.8515],
          [-74.8300, 40.8490],
          [-74.8360, 40.8492],
          [-74.8360, 40.8540]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": { "tier": "premium" },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8250, 40.8570],

          [-74.8195, 40.8544],
          [-74.8208, 40.8524],
          [-74.8245, 40.8530],
          [-74.8250, 40.8570]
        ]]
      }
    }
  ]
};
  const transitGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": {
        "name": "Hackettstown Station",
        "icon": "🚉",
        "desc": "NJ Transit Montclair-Boonton Line"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [-74.8294, 40.8520]
      }
    }
  ]
};
  const schoolsGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": {
        "name": "Hackettstown High School",
        "icon": "🏫",
        "desc": "Home of the Tigers"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [-74.8360, 40.8510]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "Centenary University",
        "icon": "🎓",
        "desc": "Historic private university"
      },
      "geometry": {
        "type": "Point",
        "coordinates": [-74.8290, 40.8555]
      }
    }
  ]
};
  const parksGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": { "name": "Riverfront Park", "icon": "🌳" },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[

          [-74.8332, 40.8497],
          [-74.8335, 40.8510]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": { "name": "Stephens State Park", "icon": "🌲" },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8210, 40.8590],
          [-74.8170, 40.8592],
          [-74.8160, 40.8560],
          [-74.8200, 40.8558],
          [-74.8210, 40.8590]
        ]]
      }
    }
  ]
};
  const riverGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": { "name": "Musconetcong River" },
      "geometry": {
        "type": "LineString",
        "coordinates": [
          [-74.8380, 40.8500],
          [-74.8350, 40.8505],
          [-74.8320, 40.8508],
          [-74.8290, 40.8510],
          [-74.8260, 40.8513],
          [-74.8230, 40.8515]
        ]
      }
    }
  ]
};

  // --- Tooltips / popups ---
  function neighborhoodPopup(feature, layer) {
    const p = feature.properties;
    const tierLabel = p.tierLabel || 'Mixed';
    const tierDesc = p.tierDesc || 'Varied home values';

    const html = `
      <div class="popup-title">🏡 ${p.name}</div>
      <div><strong>Vibe:</strong> ${p.vibe || 'Neighborhood in Hackettstown'}</div>
      <div><strong>Walkability:</strong> ${p.walkability || 'Moderate'}</div>
      <div><strong>Transit:</strong> ${p.transit || 'Near Hackettstown Station'}</div>
      <div><strong>Parks:</strong> ${p.parks || 'Nearby green space'}</div>
      <div class="popup-legend">
        <strong>Home-Value Tier:</strong> ${tierLabel}<br/>
        🟧 Premium: $600K+<br/>
        🟨 Mid-range: $400–600K<br/>
        🟦 Entry-level: &lt;$400K
      </div>
    `;
    layer.bindPopup(html);
  }

  function pointPopup(feature, layer) {
    const p = feature.properties;
    const html = `
      <div class="popup-title">${p.icon || ''} ${p.name}</div>
      <div>${p.desc || ''}</div>
    `;
    layer.bindPopup(html);
  }

  // --- Layers ---
  const neighborhoodsLayer = L.geoJSON(neighborhoodsGeoJSON, {
    style: neighborhoodStyle,
    onEachFeature: neighborhoodPopup
  });

  const valueLayer = L.geoJSON(valueZonesGeoJSON, {
    style: valueStyle,
    onEachFeature: neighborhoodPopup
  });

  const transitLayer = L.geoJSON(transitGeoJSON, {
    pointToLayer: (f, latlng) => L.marker(latlng, { icon: iconBlack }),
    onEachFeature: pointPopup
  });

  const schoolsLayer = L.geoJSON(schoolsGeoJSON, {
    pointToLayer: (f, latlng) => L.marker(latlng, { icon: iconBlack }),
    onEachFeature: pointPopup
  });

  const parksLayer = L.geoJSON(parksGeoJSON, {
    style: { color: '#2e7d32', weight: 2, fillColor: '#66bb6a', fillOpacity: 0.4 },
    onEachFeature: pointPopup
  });

  const riverLayer = L.geoJSON(riverGeoJSON, {
    style: { color: '#1e88e5', weight: 3 }
  });

  // --- Layer control ---
  const overlays = {
    'Neighborhoods': neighborhoodsLayer,
    'Home-Value Shading': valueLayer,
    'Transit': transitLayer,
    'Schools': schoolsLayer,
    'Parks': parksLayer,
    'River': riverLayer
  };

  L.control.layers(null, overlays, { collapsed: false }).addTo(map);

  // Add default visible layers
  neighborhoodsLayer.addTo(map);
  valueLayer.addTo(map);
  parksLayer.addTo(map);
  riverLayer.addTo(map);

  // --- Legend ---
  const legend = L.control({ position: 'bottomright' });

  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <strong>Home-Value Tiers</strong><br/>
      <i style="background:#f36f21"></i> Premium ($600K+)<br/>
      <i style="background:#f9a64a"></i> Mid-range ($400–600K)<br/>
      <i style="background:#ffe5c7"></i> Entry-level (&lt;$400K)
    `;
    return div;
  };

  legend.addTo(map);
</script>
</body>
</html>
