<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Where to Live in Hackettstown, NJ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
  />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: 100vh; }

    .legend {
      background: #fff;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.4;
      border-radius: 4px;
      box-shadow: 0 0 4px rgba(0,0,0,0.3);
    }
    .legend i {
      width: 14px;
      height: 14px;
      float: left;
      margin-right: 6px;
      opacity: 0.9;
    }

    .leaflet-popup-content {
      font-size: 13px;
    }
    .popup-title {
      font-weight: 600;
      color: #f36f21; /* Hackettstown Tiger orange */
      margin-bottom: 4px;
    }
    .popup-legend {
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px solid #ddd;
      font-size: 11px;
    }
  </style>
</head>
<body>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // --- Base map ---
  const map = L.map('map').setView([40.853, -74.829], 16); // whole-town frame

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // --- Style helpers (Tiger theme) ---
  function neighborhoodStyle(feature) {
    return {
      color: '#000000',
      weight: 2,
      fillColor: feature.properties.fillColor || '#f36f21',
      fillOpacity: 0.35
    };
  }

  const iconBlack = L.icon({
    iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34]
  });

  // --- GeoJSON placeholders ---
  // Replace these with your actual GeoJSON files or inline objects.

  const neighborhoodsGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    {
      "type": "Feature",
      "properties": {
        "name": "Willow Grove",
        "vibe": "Quiet residential, close to schools",
        "walkability": "Moderate",
        "transit": "6 min to Station",
        "parks": "Near Riverfront Park",
        "tierLabel": "Mid-range",
        "tierDesc": "$400–600K",
        "fillColor": "#f9a64a"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8365, 40.8538],
          [-74.8332, 40.8539],
          [-74.8298, 40.8514],
          [-74.8301, 40.8489],
          [-74.8359, 40.8492],
          [-74.8365, 40.8538]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "College View",
        "vibe": "Walkable, near Centenary University",
        "walkability": "High",
        "transit": "Quick access to 46",
        "parks": "Close to Stephens State Park",
        "tierLabel": "Mid-range",
        "tierDesc": "$400–600K",
        "fillColor": "#f9a64a"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8297, 40.8568],
          [-74.8268, 40.8570],
          [-74.8249, 40.8548],
          [-74.8254, 40.8529],
          [-74.8292, 40.8530],
          [-74.8297, 40.8568]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "Mountain View",
        "vibe": "Hillside homes, quiet streets",
        "walkability": "Low",
        "transit": "Close to Rt 517",
        "parks": "Near Stephens State Park",
        "tierLabel": "Premium",
        "tierDesc": "$600K+",
        "fillColor": "#f36f21"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8248, 40.8567],
          [-74.8210, 40.8572],
          [-74.8195, 40.8544],
          [-74.8208, 40.8524],
          [-74.8245, 40.8530],
          [-74.8248, 40.8567]
        ]]
      }
    },
    {
      "type": "Feature",
      "properties": {
        "name": "Downtown",
        "vibe": "Walkable, shops & dining",
        "walkability": "High",
        "transit": "3 min to Station",
        "parks": "Riverfront Park nearby",
        "tierLabel": "Entry-level",
        "tierDesc": "<$400K",
        "fillColor": "#ffe5c7"
      },
      "geometry": {
        "type": "Polygon",
        "coordinates": [[
          [-74.8320, 40.8530],
          [-74.8290, 40.8531],
          [-74.8285, 40.8510],
          [-74.8318, 40.8509],
          [-74.8320, 40.8530]
        ]]
      }
    }
  ]
};

  // --- Tooltips / popups ---
  function neighborhoodPopup(feature, layer) {
    const p = feature.properties;
    const tierLabel = p.tierLabel || 'Mixed';
    const tierDesc = p.tierDesc || 'Varied home values';

    const html = `
      <div class="popup-title">🏡 ${p.name}</div>
      <div><strong>Vibe:</strong> ${p.vibe || 'Neighborhood in Hackettstown'}</div>
      <div><strong>Walkability:</strong> ${p.walkability || 'Moderate'}</div>
      <div><strong>Transit:</strong> ${p.transit || 'Near Hackettstown Station'}</div>
      <div><strong>Parks:</strong> ${p.parks || 'Nearby green space'}</div>
      <div class="popup-legend">
        <strong>Home-Value Tier:</strong> ${tierLabel}<br/>
        🟧 Premium: $600K+<br/>
        🟨 Mid-range: $400–600K<br/>
        🟦 Entry-level: &lt;$400K
      </div>
    `;
    layer.bindPopup(html);
  }

  function pointPopup(feature, layer) {
    const p = feature.properties;
    const html = `
      <div class="popup-title">${p.icon || ''} ${p.name}</div>
      <div>${p.desc || ''}</div>
    `;
    layer.bindPopup(html);
  }

  // --- Layers ---
  const neighborhoodsLayer = L.geoJSON(neighborhoodsGeoJSON, {
    style: neighborhoodStyle,
    onEachFeature: neighborhoodPopup
  });



  const schoolsGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    { "type": "Feature", "properties": { "name": "Hatchery Hill Elementary School", "icon": "🏫", "desc": "Grades PK-2 | 398 5th Ave | (908) 852-8550" }, "geometry": { "type": "Point", "coordinates": [-74.8364, 40.8436] } },
    { "type": "Feature", "properties": { "name": "Willow Grove Elementary School", "icon": "🏫", "desc": "Grades 2-4 | 601 Willow Grove St | (908) 852-2805" }, "geometry": { "type": "Point", "coordinates": [-74.8181, 40.8632] } },
    { "type": "Feature", "properties": { "name": "Hackettstown Middle School", "icon": "🏫", "desc": "Grades 5-8 | 500 Washington St | (908) 852-8554" }, "geometry": { "type": "Point", "coordinates": [-74.8279, 40.8500] } },
    { "type": "Feature", "properties": { "name": "Hackettstown High School", "icon": "🏫", "desc": "Grades 9-12 | 599 Warren St | Home of the Tigers" }, "geometry": { "type": "Point", "coordinates": [-74.8297, 40.8431] } },
    { "type": "Feature", "properties": { "name": "Centenary University", "icon": "🎓", "desc": "400 Jefferson St | Private liberal arts university" }, "geometry": { "type": "Point", "coordinates": [-74.8343, 40.8472] } }
  ]
};

  const hospitalGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    { "type": "Feature", "properties": { "name": "Hackettstown Medical Center", "icon": "🏥", "desc": "651 Willow Grove St | Atlantic Health System | Open 24 hours" }, "geometry": { "type": "Point", "coordinates": [-74.8159, 40.8617] } }
  ]
};

  const transitGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    { "type": "Feature", "properties": { "name": "Hackettstown Train Station", "icon": "🚉", "desc": "498 Valentine St at Beatty St | NJ Transit Morristown Line | Free parking" }, "geometry": { "type": "Point", "coordinates": [-74.8420, 40.8455] } }
  ]
};

  const worshipGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    { "type": "Feature", "properties": { "name": "Trinity United Methodist Church", "icon": "⛪", "desc": "213 Main St | (908) 852-3020" }, "geometry": { "type": "Point", "coordinates": [-74.8271, 40.8526] } },
    { "type": "Feature", "properties": { "name": "Hackettstown Baptist Church", "icon": "⛪", "desc": "916 County Rd 517 | (908) 852-6577" }, "geometry": { "type": "Point", "coordinates": [-74.8240, 40.8709] } },
    { "type": "Feature", "properties": { "name": "Mountaintop Church", "icon": "⛪", "desc": "6 Naughright Rd | (908) 850-5477" }, "geometry": { "type": "Point", "coordinates": [-74.7833, 40.8506] } },
    { "type": "Feature", "properties": { "name": "Hope Center Hackettstown", "icon": "⛪", "desc": "450 Schooleys Mountain Rd | (201) 798-1234" }, "geometry": { "type": "Point", "coordinates": [-74.8215, 40.8268] } },
    { "type": "Feature", "properties": { "name": "Breakpoint Community Church", "icon": "⛪", "desc": "493 US-46" }, "geometry": { "type": "Point", "coordinates": [-74.7906, 40.8521] } }
  ]
};

  const fireGeoJSON = {
  "type": "FeatureCollection",
  "features": [
    { "type": "Feature", "properties": { "name": "Hackettstown Fire Department", "icon": "🚒", "desc": "101 Miller St | (908) 852-3300 | Open 24 hours" }, "geometry": { "type": "Point", "coordinates": [-74.8266, 40.8586] } }
  ]
};

  const schoolsLayer = L.geoJSON(schoolsGeoJSON, {
    pointToLayer: (f, latlng) => L.marker(latlng, { icon: iconBlack }),
    onEachFeature: pointPopup
  });



  const hospitalLayer = L.geoJSON(hospitalGeoJSON, {
    pointToLayer: (f, latlng) => L.marker(latlng, { icon: iconBlack }),
    onEachFeature: pointPopup
  });

  const transitLayer = L.geoJSON(transitGeoJSON, {
    pointToLayer: (f, latlng) => L.marker(latlng, { icon: iconBlack }),
    onEachFeature: pointPopup
  });

  const worshipLayer = L.geoJSON(worshipGeoJSON, {
    pointToLayer: (f, latlng) => L.marker(latlng, { icon: iconBlack }),
    onEachFeature: pointPopup
  });

  const fireLayer = L.geoJSON(fireGeoJSON, {
    pointToLayer: (f, latlng) => L.marker(latlng, { icon: iconBlack }),
    onEachFeature: pointPopup
  });

  // --- Layer control ---
  const overlays = {
    'Schools': schoolsLayer,
    'Hospital': hospitalLayer,
    'Transit': transitLayer,
    'Places of Worship': worshipLayer,
    'Fire Department': fireLayer,
    'Neighborhoods': neighborhoodsLayer,
    'Schools': schoolsLayer
  };

  L.control.layers(null, overlays, { collapsed: false }).addTo(map);

  // Add default visible layers
  neighborhoodsLayer.addTo(map);
  schoolsLayer.addTo(map);
  hospitalLayer.addTo(map);
  transitLayer.addTo(map);

  // --- Legend ---
  const legend = L.control({ position: 'bottomright' });

  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <strong>Home-Value Tiers</strong><br/>
      <i style="background:#f36f21"></i> Premium ($600K+)<br/>
      <i style="background:#f9a64a"></i> Mid-range ($400–600K)<br/>
      <i style="background:#ffe5c7"></i> Entry-level (&lt;$400K)
    `;
    return div;
  };

  legend.addTo(map);
</script>
</body>
</html>
